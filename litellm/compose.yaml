include:
  - ../shared/otel-collector/compose.yaml

services:
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG:-v1.110.0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./canary_guardrail.py:/app/canary_guardrail.py:ro
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?run ./gateway.sh creds first}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?run ./gateway.sh creds first}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      SONNET_LITELLM_MODEL: bedrock/${SONNET_MODEL_ID}
      HAIKU_LITELLM_MODEL: bedrock/${HAIKU_MODEL_ID}
      GUARDRAIL_CANARY: ${GUARDRAIL_CANARY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: litellm-poc
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 2s
      retries: 30
